[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-multiagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
data = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "prophet>=1.1",
    "yfinance>=0.2",
    "pytz>=2024.1",
]
llm = [
    "httpx>=0.27",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]
dashboard = [
    "streamlit>=1.35",
]
all = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "ccxt>=4.0",
    "pandas>=2.0",
    "prophet>=1.1",
    "yfinance>=0.2",
    "pytz>=2024.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
